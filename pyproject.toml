[project]
name = "perception_models"
version = "1.0.0"
description = "Models of the Perception family: Perception Encoder (PE, PE-AV) and Perception Language Model (PLM)."
readme = "README.md"
requires-python = ">=3.11"
license-files = ["LICENSE.PE", "LICENSE.PLM"]
authors = [{ name = "Meta AI Research, FAIR" }]
maintainers = [{ name = "Daniel Barker", email = "dcbark01@gmail.com" }]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: Other/Proprietary License",
]
# Runtime deps for the encoders (perception_models.core.vision_encoder / audio_visual_encoder).
# xformers is deliberately absent: the encoders don't need it and it has no macOS wheels.
dependencies = [
  "torch>=2.5",
  "torchvision>=0.20",
  "torchcodec>=0.1",
  "numpy>=2.1",
  "einops>=0.8",
  "timm>=1.0.15",
  "ftfy",
  "regex",
  "huggingface_hub",
  "safetensors",
  "transformers>=4.48",
  "pillow>=11.0",
]

[project.optional-dependencies]
# Everything needed for PLM training / evaluation (perception_models.core.data, apps/plm, apps/pe).
train = [
  "xformers>=0.0.28",
  "omegaconf>=2.3",
  "msgspec>=0.19",
  "rouge-score>=0.1.2",
  "sacrebleu>=2.5.1",
  "sentencepiece>=0.2",
  "tiktoken>=0.9",
  "blobfile>=3.0",
  "wandb>=0.19.8",
  "viztracer>=1.0.3",
  "lm-eval>=0.4.8",
  "scipy>=1.15.2",
  "pynvml>=12.0",
  "orjson>=3.10.15",
  "pyahocorasick>=2.1",
  "iopath>=0.1.10",
  "torchdata>=0.11",
  "decord>=0.6",
  "opencv-python>=4.11",
  "pycocoevalcap>=1.2",
  "scikit-learn>=1.6.1",
  "tokenizers>=0.21.1",
  "webdataset>=0.2.111",
  "fsspec",
  "datatrove",
]

[project.urls]
Homepage = "https://github.com/facebookresearch/perception_models"

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.hatch.build.targets.wheel]
packages = ["src/perception_models"]

[tool.hatch.build.targets.sdist]
include = ["src/perception_models", "tests", "LICENSE.*", "README.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# `apps/` is not packaged; put the repo root on sys.path so tests can import it.
pythonpath = ["."]

# ---------------------------------------------------------------------------
# pixi
# ---------------------------------------------------------------------------

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["osx-arm64", "linux-64"]

# Heavy / native deps come from conda-forge; the rest resolve from PyPI.
[tool.pixi.dependencies]
python = "3.12.*"
pytorch = ">=2.5"
torchvision = ">=0.20"
torchcodec = ">=0.1"
ffmpeg = "*"

[tool.pixi.pypi-dependencies]
perception_models = { path = ".", editable = true }

[tool.pixi.feature.train.dependencies]
xformers = ">=0.0.28"
decord = ">=0.6"
# `datasets` (via lm-eval) caps fsspec below what pytorch pulls in by default.
fsspec = "<=2026.6.0"

[tool.pixi.feature.train.pypi-dependencies]
perception_models = { path = ".", editable = true, extras = ["train"] }

[tool.pixi.feature.dev.dependencies]
pytest = ">=8.3"
ruff = ">=0.8"

[tool.pixi.feature.dev.tasks]
# The legacy tests (dataloader_test, llama3_tokenizer_test) need CUDA xformers + PLM data; run them explicitly.
test = { cmd = "pytest tests/test_package.py", default-environment = "dev", description = "Run the package tests" }
lint = { cmd = "ruff check src tests", default-environment = "dev", description = "Lint src and tests with ruff" }

# Lightweight env for packaging: no torch, just the PEP 517 frontend + twine.
[tool.pixi.feature.build.dependencies]
python = "3.12.*"
python-build = ">=1.2"
twine = ">=6.0"

[tool.pixi.feature.build.tasks]
clean = { cmd = "rm -rf dist build", description = "Remove build artifacts" }
build = { cmd = "python -m build --outdir dist", depends-on = ["clean"], description = "Build sdist + wheel into dist/" }
wheel = { cmd = "python -m build --wheel --outdir dist", depends-on = ["clean"], description = "Build only the wheel" }
sdist = { cmd = "python -m build --sdist --outdir dist", depends-on = ["clean"], description = "Build only the sdist" }
check = { cmd = "twine check --strict dist/*", description = "Validate built distributions' metadata" }
inspect = { cmd = "python -m zipfile -l dist/*.whl", description = "List the files packed into the built wheel" }

[tool.pixi.environments]
default = { solve-group = "default" }
dev = { features = ["dev"], solve-group = "default" }
train = { features = ["train", "dev"] }
build = { features = ["build"], no-default-feature = true }

[tool.pixi.tasks]
check-import = "python -c 'import perception_models.core.vision_encoder.pe as pe, perception_models.core.audio_visual_encoder as av; print(pe.CLIP.available_configs())'"
